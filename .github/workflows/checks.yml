name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test backend
        run: python -m unittest discover -s tests -v
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend types
        run: pnpm run typecheck
      - name: Build frontend
        run: pnpm run build
      - name: Test frontend behavior
        run: pnpm run test:ui
      - name: Package and smoke-test backend
        run: python scripts/package.py
      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: release-decky
          path: out/8bitdo-deck.zip
          if-no-files-found: error
          retention-days: 14

  standalone:
    name: Standalone ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Validate versions
        run: python scripts/check_version.py
      - name: Test backend on native architecture
        run: python -m unittest discover -s tests -v
      - name: Build Python distributions
        run: python -m build --no-isolation --outdir out/python
      - name: Smoke-test installed wheel outside checkout
        run: python scripts/smoke_distributions.py --wheel out/python/*.whl
      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm --distpath out/binary --workpath out/pyinstaller packaging/eightbitdo.spec
      - name: Smoke-test executable without Python on PATH
        run: python scripts/smoke_distributions.py --binary out/binary/eightbitdo
      - name: Archive executable and bundled-component notices
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python scripts/check_version.py)
          ARCHIVE="eightbitdo-updater-$VERSION-linux-$TARGET_ARCH"
          mkdir -p "out/$ARCHIVE/licenses" out/release
          cp out/binary/eightbitdo packaging/BINARY_NOTICES.md "out/$ARCHIVE/"
          python packaging/collect_licenses.py "out/$ARCHIVE/licenses"
          tar -C out -czf "out/release/$ARCHIVE.tar.gz" "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: out/release/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x86_64'
        with:
          name: release-python
          path: out/python/*
          if-no-files-found: error
          retention-days: 14
