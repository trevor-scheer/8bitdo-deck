name: Checks
on:
  push:
    branches: ['**', '!updates']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Test backend and signed app updates
        run: python -m unittest discover -s tests -v
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:ui
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:desktop
      - name: Package Decky frontend
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-decky
          path: out/8bitdo-deck.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-report
          path: playwright-report/
          retention-days: 7

  native:
    name: Native ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
            bundles: appimage
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: aarch64
            bundles: appimage
          - runner: macos-15
            platform: macos
            arch: aarch64
            bundles: dmg
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            bundles: dmg
          - runner: windows-2022
            platform: windows
            arch: x86_64
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install --require-hashes -r requirements-build.txt
      - run: python scripts/check_version.py
      - name: Test backend on native OS
        run: python -m unittest discover -s tests -v
      - name: Build and smoke-test Python distributions
        run: |
          python -m build --no-isolation --outdir out/python
          python scripts/smoke_distributions.py --wheel out/python/*.whl
      - name: Build and smoke-test bundled backend
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          python -m PyInstaller --clean --noconfirm --distpath out/binary --workpath out/pyinstaller packaging/eightbitdo.spec
          python scripts/smoke_distributions.py --binary out/binary/eightbitdo${{ matrix.platform == 'windows' && '.exe' || '' }}
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package backend and prepare desktop sidecar
        run: python scripts/package_distributions.py prepare
      - name: Build desktop application
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}
      - name: Test desktop command boundary
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Package native installers and app-update inputs
        run: python scripts/package_distributions.py desktop
      - name: Smoke-test packaged desktop bridge
        run: python scripts/smoke_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: update-inputs-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/update-inputs/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        with:
          name: release-python
          path: out/python/*
          if-no-files-found: error
          retention-days: 14
