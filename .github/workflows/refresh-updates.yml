name: Refresh app update metadata
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: application-update-metadata
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: updates
          path: update-metadata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Refresh online metadata without the offline root key
        env:
          EIGHTBITDO_TUF_SIGNING_KEYS: ${{ secrets.EIGHTBITDO_TUF_SIGNING_KEYS }}
        run: python scripts/publish_updates.py refresh --metadata-checkout update-metadata
      - name: Publish refreshed metadata
        working-directory: update-metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*/metadata/*.json'
          git commit -m 'refresh signed application update metadata'
          git push origin HEAD:updates
