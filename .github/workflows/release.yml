name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Validate tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_version.py --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Check complete release and calculate checksums
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -name 'eightbitdo-updater-*-linux-*.tar.gz' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name 'eightbitdo_updater-*.tar.gz' | wc -l)" -eq 1
          test -s 8bitdo-deck.zip
          sha256sum ./*.tar.gz ./*.whl 8bitdo-deck.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/attest@v4
        id: provenance
        with:
          subject-path: release-assets/*
          create-storage-record: false
      - name: Include portable provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release-assets/provenance.jsonl
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            test "$(jq -r .isDraft existing-release.json)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "8BitDo Updater $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
