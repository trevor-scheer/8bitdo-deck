[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eightbitdo-updater"
dynamic = ["version"]
description = "8BitDo firmware updater with desktop, CLI, and Decky frontends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tufup==0.10.0",
    "hidapi==0.15.0; sys_platform == 'darwin' or sys_platform == 'win32'",
    "portalocker[win32]==4.4.2; sys_platform == 'win32'",
    "psutil==7.2.2",
    "platformdirs==4.14.8; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.scripts]
eightbitdo = "eightbitdo.cli:main"
eightbitdo-deck = "eightbitdo.cli:main"

[project.urls]
Repository = "https://github.com/trevor-scheer/8bitdo-deck"
Issues = "https://github.com/trevor-scheer/8bitdo-deck/issues"

[tool.setuptools.dynamic]
version = {attr = "eightbitdo.__version__"}

[tool.setuptools.package-data]
eightbitdo = ["resources/*.sh", "resources/*.json", "py.typed"]

[tool.setuptools.packages.find]
include = ["eightbitdo*"]

[dependency-groups]
build = [
    "build==1.6.1",
    "pyinstaller==6.22.3",
    "setuptools==84.2.1",
    "wheel==0.48.0",
]
